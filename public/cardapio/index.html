<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impasto Moreira — Cardápio</title>
<meta name="theme-color" content="#1b100b">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/assets/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icon-192.png">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="cardapio-bg">
<header class="brand-header">
  <div class="brand-lockup">
    <img src="/assets/logo.png" alt="Impasto Moreira">
  </div>
  <nav class="brand-nav">
    <a id="instagramLink" href="#" target="_blank" rel="noopener" style="display:none">📷 Instagram</a>
    <button onclick="openMyOrders()">📦 Meus pedidos</button>
    <button onclick="openLoyalty()">🪙 <span id="coinBadge">Fidelidade</span></button>
    <button id="installBtn" style="display:none" onclick="installApp()">📲 Instalar app</button>
    <a href="/admin">Área administrativa</a>
  </nav>
</header>

<div class="overlay" id="ordersOverlay" onclick="closeMyOrders()"></div>
<div class="drawer" id="ordersDrawer"></div>

<div class="overlay" id="loyaltyOverlay" onclick="closeLoyalty()"></div>
<div class="drawer" id="loyaltyDrawer"></div>

<div class="overlay" id="wheelOverlay" onclick="closeWheel()"></div>
<div class="wheel-modal" id="wheelModal"></div>

<div class="hero">
  <div class="tag">pizza contemporânea</div>
</div>

<main id="app"></main>

<button class="cart-fab" id="cartFab" onclick="openCart()">🛒 Carrinho <span id="cartCount">0</span></button>

<div class="overlay" id="overlay" onclick="closeCart()"></div>
<div class="drawer" id="drawer"></div>

<script>
window.onerror = function(msg, url, line, col, error){
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#c0392b;color:#fff;padding:10px;font-size:12px;z-index:99999;white-space:pre-wrap;font-family:monospace';
  banner.textContent = 'Erro JS: ' + msg + ' (linha ' + line + ')';
  document.body.appendChild(banner);
};
const money = n => Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let menu = [];
let settings = { restaurantName: "Impasto Moreira", whatsappNumber: "" };
let paymentMethods = ["PIX", "Cartão na entrega", "Dinheiro"];
let cart = JSON.parse(localStorage.im_cart || "[]");
let step = "carrinho"; // carrinho -> entrega -> confirmação
let orderType = "Delivery";
let deliveryFee = 0;
let lastOrder = null;
let appliedCoupon = null; // { code, discountAmount }
const urlParams = new URLSearchParams(window.location.search);
const tableFromUrl = urlParams.get('mesa');

function saveCart(){ localStorage.im_cart = JSON.stringify(cart); renderCartCount(); }
function renderCartCount(){ document.querySelector('#cartCount').textContent = cart.reduce((s,i)=>s+i.quantity,0); }

async function loadMenu(){
  const raw = await fetch('/api/public/menu').then(r=>r.json());
  // O banco devolve IDs como texto (BIGSERIAL); convertendo para número aqui
  // evita falhas de comparação (ex: "1" !== 1) que impediam adicionar ao carrinho.
  menu = raw.map(p => ({ ...p, id: Number(p.id), price: Number(p.price), promoPrice: p.promo_price!=null ? Number(p.promo_price) : null, promoActive: !!p.promo_active }));
  const categories = [...new Set(menu.map(p=>p.category))];
  const app = document.querySelector('#app');
  if(!categories.length){
    app.innerHTML = '<div class="card">Cardápio ainda não configurado. Volte em breve.</div>';
    return;
  }
  app.innerHTML = categories.map(cat => `
    <h2 class="category-title">${cat}</h2>
    <div class="grid">
      ${menu.filter(p=>p.category===cat).map(p => {
        const onPromo = p.promoActive && p.promoPrice != null && p.promoPrice < p.price;
        return `
        <div class="card product-card">
          ${p.image_url ? `<img class="product-img" src="${p.image_url}" alt="${p.name}">` : ''}
          ${onPromo ? `<span class="promo-tag">Promoção</span>` : ''}
          <h3>${p.name}</h3>
          <p>${p.description||''}</p>
          <div class="price">
            ${onPromo ? `<span class="price-old">${money(p.price)}</span> ${money(p.promoPrice)}` : money(p.price)}
          </div>
          <div class="qty-row">
            <button onclick="changeQty(${p.id},-1)">−</button>
            <span id="qty-${p.id}">${qtyOf(p.id)}</span>
            <button onclick="changeQty(${p.id},1)">+</button>
            <button class="btn add-btn" onclick="addToCart(${p.id})">Adicionar</button>
          </div>
        </div>
      `}).join('')}
    </div>
  `).join('');
}

let pendingQty = {};
function qtyOf(id){ return pendingQty[id] || 1; }
function changeQty(id,delta){
  pendingQty[id] = Math.max(1,(pendingQty[id]||1)+delta);
  document.querySelector('#qty-'+id).textContent = pendingQty[id];
}
function addToCart(id){
  const p = menu.find(x=>x.id===id);
  const qty = pendingQty[id]||1;
  const effectivePrice = (p.promoActive && p.promoPrice!=null && p.promoPrice<p.price) ? p.promoPrice : p.price;
  const existing = cart.find(i=>i.productId===id);
  if(existing) existing.quantity += qty;
  else cart.push({productId:id,name:p.name,price:effectivePrice,quantity:qty});
  pendingQty[id]=1;
  document.querySelector('#qty-'+id).textContent = 1;
  saveCart();
  openCart();
}
function removeFromCart(id){ cart = cart.filter(i=>i.productId!==id); saveCart(); renderCart(); }
function cartSubtotal(){ return cart.reduce((s,i)=>s+i.price*i.quantity,0); }

function openCart(){
  step = cart.length ? "carrinho" : "carrinho";
  renderCart();
  document.querySelector('#overlay').classList.add('open');
  document.querySelector('#drawer').classList.add('open');
}
function closeCart(){
  document.querySelector('#overlay').classList.remove('open');
  document.querySelector('#drawer').classList.remove('open');
}

async function renderCart(){
  const d = document.querySelector('#drawer');
  if(step==="carrinho"){
    d.innerHTML = `
      <h2 style="color:var(--gold-light)">Seu carrinho</h2>
      ${cart.length ? cart.map(i=>`
        <div class="cart-line">
          <div class="name">${i.quantity}× ${i.name}</div>
          <div>${money(i.price*i.quantity)}</div>
          <button class="btn secondary" style="padding:6px 10px" onclick="removeFromCart(${i.productId})">✕</button>
        </div>
      `).join('') : '<p class="muted">Seu carrinho está vazio.</p>'}
      <div class="cart-total"><span>Subtotal</span><span>${money(cartSubtotal())}</span></div>
      <button class="btn block" ${cart.length?'':'disabled'} onclick="step='entrega';renderCart()">Continuar</button>
      <button class="btn secondary block" style="margin-top:8px" onclick="closeCart()">Continuar comprando</button>
    `;
  } else if(step==="entrega"){
    d.innerHTML = `
      <h2 style="color:var(--gold-light)">Entrega e pagamento</h2>
      <div class="step-tabs">
        <button id="tabDelivery" class="active" onclick="setOrderType('Delivery')">Entrega</button>
        <button id="tabPickup" onclick="setOrderType('Retirada')">Retirada</button>
        <button id="tabTable" onclick="setOrderType('Mesa')">Mesa</button>
      </div>
      <label>Nome</label><input id="fCustomer">
      <label>Telefone / WhatsApp</label><input id="fPhone" placeholder="(00) 00000-0000">
      <div id="tableField" style="display:none">
        <label>Número da mesa</label><input id="fTable" type="number" value="${tableFromUrl||''}">
      </div>
      <div id="addressFields">
        <label>Rua</label><input id="fStreet">
        <label>Número</label><input id="fNumber">
        <label>Complemento</label><input id="fComplement">
        <label>Bairro</label><input id="fNeighborhood" onchange="lookupFee()">
        <label>Cidade</label><input id="fCity">
        <p class="muted" id="feeInfo">Taxa de entrega calculada pelo bairro.</p>
      </div>
      <label>Forma de pagamento</label>
      <select id="fPayment">
        ${paymentMethods.map(pm=>`<option>${pm}</option>`).join('')}
      </select>
      <label>Observações</label><textarea id="fNotes" rows="2" placeholder="Ex: sem cebola, troco para R$100..."></textarea>
      <label>Cupom de desconto</label>
      <div style="display:flex;gap:6px">
        <input id="fCoupon" placeholder="ex: PIZZA10" style="flex:1;text-transform:uppercase" value="${appliedCoupon?appliedCoupon.code:''}">
        <button class="btn secondary" style="padding:11px 14px" onclick="applyCoupon()">Aplicar</button>
      </div>
      <p class="muted" id="couponInfo">${appliedCoupon ? `Cupom ${appliedCoupon.code} aplicado: -${money(appliedCoupon.discountAmount)}` : ''}</p>
      <div class="cart-total"><span>Subtotal</span><span>${money(cartSubtotal())}</span></div>
      ${appliedCoupon ? `<div class="cart-total" style="color:#8fe0a0"><span>Desconto</span><span>-${money(appliedCoupon.discountAmount)}</span></div>` : ''}
      <div class="cart-total" id="feeLine"><span>Taxa de entrega</span><span>${money(deliveryFee)}</span></div>
      <div class="cart-total" style="border-top:1px solid var(--border);padding-top:10px"><span>Total</span><span id="totalLine">${money(cartTotal())}</span></div>
      <button class="btn block" onclick="submitOrder()">Confirmar pedido</button>
      ${settings.whatsappNumber ? `<button class="btn block" style="margin-top:8px;background:#25D366;color:#0b2e17" onclick="submitOrder(true)">📲 Confirmar e enviar pelo WhatsApp</button>` : ''}
      <button class="btn secondary block" style="margin-top:8px" onclick="step='carrinho';renderCart()">Voltar</button>
    `;
    if(tableFromUrl && orderType!=='Mesa') setOrderType('Mesa');
    else if(orderType==='Mesa'){ document.querySelector('#tabTable').classList.add('active'); document.querySelector('#tabDelivery').classList.remove('active'); document.querySelector('#addressFields').style.display='none'; document.querySelector('#tableField').style.display='block'; }
  } else if(step==="confirmacao"){
    d.innerHTML = `
      <h2 style="color:var(--gold-light)">Pedido enviado! 🎉</h2>
      <p>Seu pedido <b>#${lastOrder.orderId}</b> foi recebido pela cozinha.</p>
      <p class="muted">Total: ${money(lastOrder.total)}</p>
      <p class="muted">Acompanhe o status a qualquer momento no botão "📦 Meus pedidos", no topo da página.</p>
      <button class="btn block" onclick="finishOrder()">Fazer novo pedido</button>
    `;
  }
}

function setOrderType(type){
  orderType = type;
  document.querySelector('#tabDelivery').classList.toggle('active', type==='Delivery');
  document.querySelector('#tabPickup').classList.toggle('active', type==='Retirada');
  document.querySelector('#tabTable').classList.toggle('active', type==='Mesa');
  document.querySelector('#addressFields').style.display = type==='Delivery' ? 'block':'none';
  document.querySelector('#tableField').style.display = type==='Mesa' ? 'block':'none';
  if(type!=='Delivery'){ deliveryFee = 0; updateTotals(); }
  else lookupFee();
}

function cartTotal(){ return Math.max(0, cartSubtotal() - (appliedCoupon?appliedCoupon.discountAmount:0) + deliveryFee); }

async function applyCoupon(){
  const code = document.querySelector('#fCoupon').value.trim();
  if(!code) return;
  const r = await fetch('/api/public/coupons/validate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,subtotal:cartSubtotal()})});
  const x = await r.json();
  const info = document.querySelector('#couponInfo');
  if(!r.ok){ appliedCoupon = null; info.textContent = '❌ '+(x.error||'Cupom inválido'); updateTotals(); return; }
  appliedCoupon = { code: x.code, discountAmount: x.discountAmount };
  info.textContent = `✅ Cupom ${x.code} aplicado: -${money(x.discountAmount)}`;
  updateTotals();
}

async function lookupFee(){
  const n = document.querySelector('#fNeighborhood').value;
  if(!n) return;
  const r = await fetch('/api/public/delivery-fee?neighborhood='+encodeURIComponent(n)).then(r=>r.json());
  deliveryFee = r.fee;
  updateTotals();
}
function updateTotals(){
  document.querySelector('#feeLine').innerHTML = `<span>Taxa de entrega</span><span>${money(deliveryFee)}</span>`;
  document.querySelector('#totalLine').textContent = money(cartTotal());
}

async function submitOrder(viaWhatsApp){
  const customer = document.querySelector('#fCustomer').value.trim();
  const phone = document.querySelector('#fPhone').value.trim();
  if(!customer || !phone) return alert('Preencha nome e telefone.');
  const address = orderType==='Delivery' ? {
    street: document.querySelector('#fStreet').value,
    number: document.querySelector('#fNumber').value,
    complement: document.querySelector('#fComplement').value,
    neighborhood: document.querySelector('#fNeighborhood').value,
    city: document.querySelector('#fCity').value
  } : null;
  const tableNumber = orderType==='Mesa' ? document.querySelector('#fTable').value : null;
  if(orderType==='Mesa' && !tableNumber) return alert('Informe o número da mesa.');
  const paymentMethod = document.querySelector('#fPayment').value;
  const notes = document.querySelector('#fNotes').value;
  const payload = {
    customer, phone, orderType, paymentMethod, notes, address, tableNumber,
    couponCode: appliedCoupon ? appliedCoupon.code : null,
    referralCode: localStorage.im_referral || null,
    items: cart.map(i=>({productId:i.productId,quantity:i.quantity}))
  };
  const r = await fetch('/api/public/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  const x = await r.json();
  if(!r.ok) return alert(x.error || 'Não foi possível enviar o pedido.');
  lastOrder = x;
  saveMyOrder(x.orderId);
  appliedCoupon = null;
  localStorage.im_phone = phone;
  localStorage.im_name = customer;
  localStorage.removeItem('im_referral');

  if(viaWhatsApp && settings.whatsappNumber){
    const lines = [
      `*Novo pedido #${x.orderId} — ${settings.restaurantName}*`,
      ...cart.map(i=>`${i.quantity}x ${i.name} — ${money(i.price*i.quantity)}`),
      orderType==='Delivery' ? `Entrega: ${address.street}, ${address.number} - ${address.neighborhood}` : (orderType==='Mesa' ? `Mesa ${tableNumber}` : 'Retirada no local'),
      `Pagamento: ${paymentMethod}`,
      notes ? `Obs: ${notes}` : null,
      `*Total: ${money(x.total)}*`,
      `Cliente: ${customer} (${phone})`
    ].filter(Boolean).join('\n');
    window.open(`https://wa.me/${settings.whatsappNumber}?text=${encodeURIComponent(lines)}`, '_blank');
  }

  step = "confirmacao";
  renderCart();
}
function finishOrder(){
  cart = [];
  saveCart();
  closeCart();
}

/* ---------- Meus pedidos (acompanhamento de status ao vivo pro cliente) ---------- */
let myOrdersPollInterval = null;

function getMyOrders(){
  try{ return JSON.parse(localStorage.im_orders || '[]'); }catch{ return []; }
}
function saveMyOrder(id){
  let list = getMyOrders().filter(o=>o.id!==id);
  list.unshift({ id, date: new Date().toISOString() });
  localStorage.im_orders = JSON.stringify(list.slice(0,10));
}

function openMyOrders(){
  document.querySelector('#ordersOverlay').classList.add('open');
  document.querySelector('#ordersDrawer').classList.add('open');
  renderMyOrders();
  if(myOrdersPollInterval) clearInterval(myOrdersPollInterval);
  myOrdersPollInterval = setInterval(renderMyOrders, 10000); // atualiza status sozinho a cada 10s
}
function closeMyOrders(){
  document.querySelector('#ordersOverlay').classList.remove('open');
  document.querySelector('#ordersDrawer').classList.remove('open');
  if(myOrdersPollInterval){ clearInterval(myOrdersPollInterval); myOrdersPollInterval = null; }
}

async function renderMyOrders(){
  const list = getMyOrders();
  const d = document.querySelector('#ordersDrawer');
  if(!list.length){
    d.innerHTML = `<h2 style="color:var(--gold-light)">Meus pedidos</h2><p class="muted">Você ainda não fez nenhum pedido neste navegador/celular.</p>`;
    return;
  }
  const results = await Promise.all(list.map(async o => {
    try{ return await fetch('/api/public/orders/'+o.id+'/status').then(r=>r.json()); }
    catch{ return { id:o.id, status:null }; }
  }));
  d.innerHTML = `<h2 style="color:var(--gold-light)">Meus pedidos</h2>` +
    results.map(o => `
      <div class="cart-line" style="flex-direction:column;align-items:flex-start;gap:6px">
        <div style="display:flex;justify-content:space-between;width:100%;align-items:center">
          <b>Pedido #${o.id}</b>
          ${o.status ? `<span class="badge" data-status="${o.status}">${o.status}</span>` : '<span class="muted">não encontrado</span>'}
        </div>
        ${o.total ? `<span class="muted">${money(o.total)} • ${o.order_type||''}</span>` : ''}
      </div>
    `).join('');
}

async function loadSettings(){
  try{
    settings = await fetch('/api/public/settings').then(r=>r.json());
    if(settings.instagramUrl){
      const link = document.querySelector('#instagramLink');
      link.href = settings.instagramUrl;
      link.style.display = 'inline-flex';
    }
  }catch{}
  try{
    const pm = await fetch('/api/public/payment-methods').then(r=>r.json());
    if(pm.length) paymentMethods = pm;
  }catch{}
}

/* ---------- Fidelidade: moedas, check-in diário e roleta ---------- */
let loyaltyStatus = null;

(function captureReferral(){
  const ref = new URLSearchParams(location.search).get('ref');
  if(ref) localStorage.im_referral = ref.toUpperCase().trim();
})();

async function refreshLoyaltyBadge(){
  const phone = localStorage.im_phone;
  const badge = document.querySelector('#coinBadge');
  if(!phone){ badge.textContent = 'Fidelidade'; return; }
  try{
    loyaltyStatus = await fetch('/api/public/loyalty/status?phone='+encodeURIComponent(phone)).then(r=>r.json());
    badge.textContent = loyaltyStatus.coins + (loyaltyStatus.spinsAvailable > 0 ? ' 🎡' : '');
  }catch{ badge.textContent = 'Fidelidade'; }
}

function openLoyalty(){
  document.querySelector('#loyaltyOverlay').classList.add('open');
  document.querySelector('#loyaltyDrawer').classList.add('open');
  renderLoyaltyDrawer();
}
function closeLoyalty(){
  document.querySelector('#loyaltyOverlay').classList.remove('open');
  document.querySelector('#loyaltyDrawer').classList.remove('open');
}

async function renderLoyaltyDrawer(){
  const d = document.querySelector('#loyaltyDrawer');
  const phone = localStorage.im_phone;

  if(!phone){
    d.innerHTML = `
      <h2 style="color:var(--gold-light)">Fidelidade</h2>
      <p class="muted">Informe seu nome e telefone (o mesmo que você usa nos pedidos) pra ver suas moedas.</p>
      <label>Nome</label><input id="lyName" placeholder="Seu nome">
      <label>Telefone</label><input id="lyPhone" placeholder="(00) 00000-0000">
      <button class="btn block" onclick="identifyLoyalty()">Ver minhas moedas</button>
    `;
    return;
  }

  d.innerHTML = `<h2 style="color:var(--gold-light)">Fidelidade</h2><p class="muted">Carregando...</p>`;
  try{
    loyaltyStatus = await fetch('/api/public/loyalty/status?phone='+encodeURIComponent(phone)).then(r=>r.json());
  }catch{
    d.innerHTML = `<h2 style="color:var(--gold-light)">Fidelidade</h2><p class="muted">Não foi possível carregar agora. Tente de novo mais tarde.</p>`;
    return;
  }

  const s = loyaltyStatus;
  const shareLink = location.origin + location.pathname + '?ref=' + (s.referralCode || '');

  d.innerHTML = `
    <h2 style="color:var(--gold-light)">Fidelidade</h2>
    <div class="cart-total" style="margin-top:0"><span>Suas moedas</span><span>🪙 ${s.coins}</span></div>

    <div style="margin:16px 0;padding:14px;border:1px solid var(--border);border-radius:10px">
      ${s.checkedInToday
        ? `<p class="muted" style="margin:0">✅ Você já fez o check-in de hoje. Sequência: ${s.streak} dia(s). Volte amanhã!</p>`
        : `<p class="muted" style="margin:0 0 10px">Faça check-in todo dia e ganhe moedas — a cada 7 dias seguidos, um giro bônus na roleta!</p>
           <button class="btn block" onclick="doCheckin()">Fazer check-in de hoje</button>`}
    </div>

    ${s.spinsAvailable > 0 ? `
      <div style="margin:16px 0;padding:14px;background:var(--bg-elevated);border-radius:10px;text-align:center">
        <p style="margin:0 0 10px;color:var(--gold-light);font-weight:600">🎉 Você tem ${s.spinsAvailable} giro(s) na roleta!</p>
        <button class="btn block" onclick="closeLoyalty();openWheel()">Girar a roleta</button>
      </div>
    ` : ''}

    <div style="margin-top:20px">
      <label>Indique um amigo</label>
      <p class="muted" style="margin:0 0 8px">Cada amigo que pedir pela primeira vez usando seu link te dá moedas extras.</p>
      <input readonly value="${shareLink}" onclick="this.select()">
      <button class="btn secondary block" onclick="copyReferralLink('${shareLink}')">Copiar link de indicação</button>
    </div>

    <button class="btn secondary block" style="margin-top:20px" onclick="forgetLoyaltyPhone()">Não sou eu / trocar telefone</button>
  `;
}

function identifyLoyalty(){
  const name = document.querySelector('#lyName').value.trim();
  const phone = document.querySelector('#lyPhone').value.trim();
  if(!name || !phone) return alert('Preencha nome e telefone.');
  localStorage.im_name = name;
  localStorage.im_phone = phone;
  renderLoyaltyDrawer();
  refreshLoyaltyBadge();
}

function forgetLoyaltyPhone(){
  localStorage.removeItem('im_phone');
  localStorage.removeItem('im_name');
  renderLoyaltyDrawer();
  refreshLoyaltyBadge();
}

function copyReferralLink(link){
  navigator.clipboard?.writeText(link).then(()=>alert('Link copiado!')).catch(()=>{});
}

async function doCheckin(){
  const phone = localStorage.im_phone, name = localStorage.im_name;
  try{
    const r = await fetch('/api/public/loyalty/checkin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone,name})});
    const x = await r.json();
    if(!r.ok) return alert(x.error || 'Não foi possível fazer o check-in.');
    alert(`+${x.coinsAwarded} moeda(s)! Sequência: ${x.streak} dia(s)${x.bonusSpin ? ' — giro bônus liberado! 🎉' : ''}`);
    renderLoyaltyDrawer();
    refreshLoyaltyBadge();
  }catch{ alert('Não foi possível fazer o check-in agora.'); }
}

/* ---------- Roleta ---------- */
let wheelPrizes = [];

async function openWheel(){
  document.querySelector('#wheelOverlay').classList.add('open');
  const m = document.querySelector('#wheelModal');
  m.classList.add('open');
  m.innerHTML = `<p class="muted" style="text-align:center">Carregando roleta...</p>`;
  try{
    wheelPrizes = await fetch('/api/public/loyalty/prizes').then(r=>r.json());
  }catch{ wheelPrizes = []; }
  if(!wheelPrizes.length){
    m.innerHTML = `<p class="muted" style="text-align:center">Roleta indisponível no momento.</p><button class="btn block" onclick="closeWheel()">Fechar</button>`;
    return;
  }
  renderWheel();
}
function closeWheel(){
  document.querySelector('#wheelOverlay').classList.remove('open');
  document.querySelector('#wheelModal').classList.remove('open');
}

function renderWheel(){
  const n = wheelPrizes.length;
  const slice = 360 / n;
  const colors = ['#c9862e','#8a3a2c','#e3b876','#4a3626'];
  let gradParts = [];
  wheelPrizes.forEach((p,i)=>{
    gradParts.push(`${colors[i%colors.length]} ${i*slice}deg ${(i+1)*slice}deg`);
  });
  const labelsHtml = wheelPrizes.map((p,i)=>{
    const angle = slice*i + slice/2;
    return `<div class="wheel-label" style="transform:rotate(${angle}deg) translate(0,-108px) rotate(${-angle}deg)">${p}</div>`;
  }).join('');

  const m = document.querySelector('#wheelModal');
  m.innerHTML = `
    <h2 style="color:var(--gold-light);text-align:center;margin-top:0">Roleta da sorte</h2>
    <div class="wheel-wrap">
      <div class="wheel-pointer">▼</div>
      <div class="wheel-disc" id="wheelDisc" style="background:conic-gradient(${gradParts.join(',')})">
        ${labelsHtml}
      </div>
    </div>
    <button class="btn block" id="spinBtn" style="margin-top:22px" onclick="doSpin()">Girar!</button>
    <div id="wheelResult"></div>
  `;
}

async function doSpin(){
  const phone = localStorage.im_phone;
  document.querySelector('#spinBtn').disabled = true;
  document.querySelector('#spinBtn').textContent = 'Girando...';
  let result;
  try{
    const r = await fetch('/api/public/loyalty/spin',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone})});
    result = await r.json();
    if(!r.ok) throw new Error(result.error || 'Não foi possível girar agora.');
  }catch(e){
    alert(e.message);
    document.querySelector('#spinBtn').disabled = false;
    document.querySelector('#spinBtn').textContent = 'Girar!';
    return;
  }

  const n = wheelPrizes.length;
  const slice = 360 / n;
  let idx = wheelPrizes.indexOf(result.prize);
  if(idx < 0) idx = 0;
  const targetAngle = 360 - (idx*slice + slice/2); // gira até o prêmio parar sob o ponteiro (topo)
  const spins = 5 * 360;
  const disc = document.querySelector('#wheelDisc');
  disc.style.transition = 'transform 4s cubic-bezier(.17,.67,.32,1.02)';
  disc.style.transform = `rotate(${spins + targetAngle}deg)`;

  setTimeout(()=>{
    document.querySelector('#wheelResult').innerHTML = `
      <div style="margin-top:18px;padding:16px;background:var(--bg-elevated);border-radius:10px;text-align:center">
        <p style="margin:0 0 6px;font-size:1.1rem;color:var(--gold-light);font-weight:700">🎉 ${result.prize}</p>
        ${result.couponCode
          ? `<p class="muted" style="margin:0 0 10px">Use o cupom no seu próximo pedido:</p>
             <input readonly value="${result.couponCode}" onclick="this.select()" style="text-align:center;font-weight:700">`
          : `<p class="muted" style="margin:0">Não foi dessa vez — continue pedindo pra ganhar mais giros!</p>`}
        <button class="btn secondary block" style="margin-top:10px" onclick="closeWheel()">Fechar</button>
      </div>
    `;
    refreshLoyaltyBadge();
  }, 4200);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js').then(reg => {
      reg.update();
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') reg.update();
      });
    }).catch(()=>{});
  });
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  document.querySelector('#installBtn').style.display = 'inline-flex';
});
function installApp(){
  if(!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt = null;
  document.querySelector('#installBtn').style.display = 'none';
}

renderCartCount();
loadSettings();
loadMenu();
refreshLoyaltyBadge();
</script>
