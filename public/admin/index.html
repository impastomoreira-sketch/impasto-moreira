<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Impasto Moreira — Painel</title>
<link rel="icon" href="/assets/logo.png">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body class="admin">
<header class="brand-header">
  <div class="brand-lockup">
    <img src="/assets/logo.png" alt="Impasto Moreira">
    <div>
      <div class="name">Painel administrativo</div>
      <span class="role-badge" id="roleBadge" style="display:none"></span>
    </div>
  </div>
  <nav class="brand-nav" id="nav"></nav>
</header>
<main id="app"></main>
<div id="toastContainer" style="position:fixed;top:16px;right:16px;z-index:500;display:flex;flex-direction:column;gap:8px;max-width:320px"></div>
<script>
const API = '/api';
const money = n => Number(n||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
let token = localStorage.im_token || "";
let user = JSON.parse(localStorage.im_user || "null");
let currentView = "dashboard";

async function api(url, opt={}){
  opt.headers = {...(opt.headers||{}), Authorization: 'Bearer '+token, ...(opt.body?{'Content-Type':'application/json'}:{})};
  const r = await fetch(API+url, opt);
  if(r.status===401){ logout(); throw new Error('sessão expirada'); }
  const data = await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(data.error || 'Erro na requisição');
  return data;
}

function logout(){ stopOrderWatcher(); localStorage.removeItem('im_token'); localStorage.removeItem('im_user'); token=""; user=null; renderLogin(); }

function renderLogin(){
  document.querySelector('#nav').innerHTML = '';
  document.querySelector('#roleBadge').style.display = 'none';
  document.querySelector('#app').innerHTML = `
    <div class="card" style="max-width:400px;margin:60px auto">
      <h2>Entrar</h2>
      <label>E-mail</label><input id="email">
      <label>Senha</label><input id="pass" type="password">
      <button class="btn block" onclick="doLogin()">Entrar</button>
      <p class="muted" id="loginError"></p>
    </div>`;
}

async function doLogin(){
  const email = document.querySelector('#email').value.trim();
  const password = document.querySelector('#pass').value;
  try{
    const r = await fetch(API+'/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})});
    const x = await r.json();
    if(!r.ok) throw new Error(x.error);
    token = x.token; user = x.user;
    localStorage.im_token = token; localStorage.im_user = JSON.stringify(user);
    boot();
  }catch(e){ document.querySelector('#loginError').textContent = e.message; }
}

const NAV_BY_ROLE = {
  admin: [['dashboard','Dashboard'],['orders','Pedidos'],['kitchen','Cozinha'],['products','Cardápio'],['stock','Estoque'],['delivery','Entrega'],['coupons','Cupons'],['finance','Financeiro'],['reports','Relatórios'],['users','Usuários'],['settings','Configurações']],
  atendimento: [['orders','Pedidos'],['kitchen','Cozinha']],
  cozinha: [['kitchen','Cozinha']]
};

function renderNav(){
  const items = NAV_BY_ROLE[user.role] || [];
  document.querySelector('#nav').innerHTML = items.map(([id,label]) =>
    `<button id="nav-${id}" onclick="go('${id}')">${label}</button>`
  ).join('') + `<button onclick="logout()">Sair</button>`;
  document.querySelector('#roleBadge').style.display = 'inline-block';
  document.querySelector('#roleBadge').textContent = user.role;
}

function go(view){
  currentView = view;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.remove('active'));
  const btn = document.querySelector('#nav-'+view);
  if(btn) btn.classList.add('active');
  const renderers = { dashboard:renderDashboard, orders:renderOrders, kitchen:renderKitchen, products:renderProducts, stock:renderStock, delivery:renderDelivery, coupons:renderCoupons, finance:renderFinance, reports:renderReports, users:renderUsers, settings:renderSettings };
  (renderers[view]||renderDashboard)();
}

function boot(){
  if(!token || !user){ renderLogin(); return; }
  renderNav();
  const items = NAV_BY_ROLE[user.role] || [];
  go(items[0] ? items[0][0] : 'dashboard');
  startOrderWatcher();
}

/* ---------- Alerta de pedido novo (som + aviso na tela + notificação do navegador) ---------- */
let lastOrderId = null;
let orderWatcherInterval = null;

function startOrderWatcher(){
  if(!['admin','atendimento','cozinha'].includes(user.role)) return;
  if('Notification' in window && Notification.permission === 'default'){
    Notification.requestPermission();
  }
  checkNewOrders();
  if(orderWatcherInterval) clearInterval(orderWatcherInterval);
  orderWatcherInterval = setInterval(checkNewOrders, 12000);
}
function stopOrderWatcher(){
  if(orderWatcherInterval) clearInterval(orderWatcherInterval);
  orderWatcherInterval = null;
  lastOrderId = null;
}
async function checkNewOrders(){
  try{
    const orders = await api('/admin/orders');
    if(!orders.length) return;
    const maxId = Math.max(...orders.map(o=>o.id));
    if(lastOrderId === null){ lastOrderId = maxId; return; } // primeira checagem só marca o ponto de partida
    if(maxId > lastOrderId){
      orders.filter(o=>o.id > lastOrderId).sort((a,b)=>a.id-b.id).forEach(announceNewOrder);
      lastOrderId = maxId;
      if(currentView==='orders' || currentView==='kitchen' || currentView==='dashboard') go(currentView);
    }
  }catch(e){ /* falha de rede silenciosa, tenta de novo na próxima checagem */ }
}
function announceNewOrder(o){
  playBeep();
  showToast(`🔔 Novo pedido #${o.id} — ${o.customer||'Cliente'} — ${money(o.total)}`);
  if('Notification' in window && Notification.permission === 'granted'){
    new Notification('Novo pedido recebido!', {
      body: `#${o.id} — ${o.customer||'Cliente'} — ${money(o.total)}`,
      icon: '/assets/icon-192.png'
    });
  }
}
function playBeep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    [880, 1108].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.value = 0.18;
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(ctx.currentTime + i*0.16);
      osc.stop(ctx.currentTime + i*0.16 + 0.15);
    });
    setTimeout(()=>ctx.close(), 500);
  }catch(e){}
}
function showToast(msg){
  const c = document.querySelector('#toastContainer');
  const el = document.createElement('div');
  el.textContent = msg;
  el.style.cssText = 'background:var(--gold);color:#241608;padding:12px 16px;border-radius:10px;font-weight:600;font-size:.9rem;box-shadow:0 8px 20px rgba(0,0,0,.35);cursor:pointer';
  el.onclick = () => el.remove();
  c.appendChild(el);
  setTimeout(()=>el.remove(), 8000);
}

/* ---------- Dashboard ---------- */

  app.innerHTML = '<p class="muted">Carregando...</p>';
  const [summary, lowStock, topProducts] = await Promise.all([
    api('/admin/finance/summary'),
    api('/admin/reports/low-stock'),
    api('/admin/reports/top-products')
  ]);
  app.innerHTML = `
    <div class="grid">
      <div class="card"><span class="muted">Receita total</span><div class="kpi">${money(summary.revenue)}</div></div>
      <div class="card"><span class="muted">Despesas</span><div class="kpi">${money(summary.expenses)}</div></div>
      <div class="card"><span class="muted">Saldo</span><div class="kpi">${money(summary.balance)}</div></div>
      <div class="card"><span class="muted">Ingredientes em estoque baixo</span><div class="kpi">${lowStock.length}</div></div>
    </div>
    <h2 class="category-title" style="color:var(--gold)">Mais vendidos</h2>
    <table><thead><tr><th>Produto</th><th>Qtd.</th><th>Receita</th></tr></thead>
    <tbody>${topProducts.slice(0,8).map(p=>`<tr><td>${p.product_name}</td><td>${p.qty}</td><td>${money(p.revenue)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Sem dados ainda</td></tr>'}</tbody></table>
    ${lowStock.length ? `<h2 class="category-title" style="color:var(--gold)">⚠️ Estoque baixo</h2>
    <div class="grid">${lowStock.map(i=>`<div class="card"><b>${i.name}</b><p class="muted">${i.stock_qty} ${i.unit} (mínimo: ${i.min_qty})</p></div>`).join('')}</div>` : ''}

}

/* ---------- Pedidos ---------- */
async function renderOrders(){
  const app = document.querySelector('#app');
  app.innerHTML = '<p class="muted">Carregando...</p>';
  const orders = await api('/admin/orders');
  app.innerHTML = `
    <h1>Pedidos</h1>
    <div class="grid">
      ${orders.map(o => `
        <div class="card">
          <b>#${o.id} — ${o.customer||'Cliente'}</b>
          <p class="muted">${o.phone||''}</p>
          <p>${o.order_type}${o.table_number ? ' • Mesa '+o.table_number : ''}${o.neighborhood ? ' • '+o.neighborhood : ''} • ${o.payment_method}</p>
          <p><span class="badge" data-status="${o.status}">${o.status}</span></p>
          <b>${money(o.total)}</b>
          ${o.discount_amount>0 ? `<p class="muted">Cupom ${o.coupon_code}: -${money(o.discount_amount)}</p>` : ''}
          <div style="margin-top:10px">
            <select onchange="updateStatus(${o.id},this.value)">
              ${['Recebido','Preparando','Pronto','Saiu para entrega','Entregue','Cancelado'].map(s=>`<option ${s===o.status?'selected':''}>${s}</option>`).join('')}
            </select>
          </div>
          ${user.role==='admin' ? `<button class="btn danger" style="margin-top:8px;padding:6px 10px;font-size:.8rem" onclick="deleteOrder(${o.id})">Excluir pedido</button>` : ''}
        </div>
      `).join('') || '<p class="muted">Nenhum pedido ainda.</p>'}
    </div>
  `;
}

async function updateStatus(id, status){
  try{ await api(`/admin/orders/${id}/status`,{method:'PATCH',body:JSON.stringify({status})}); go(currentView); }
  catch(e){ alert(e.message); }
}
async function deleteOrder(id){
  if(!confirm('Excluir este pedido? Isso desfaz a baixa de estoque e o lançamento financeiro ligados a ele. Não pode ser desfeito.')) return;
  try{ await api(`/admin/orders/${id}`,{method:'DELETE'}); go(currentView); }
  catch(e){ alert(e.message); }
}

/* ---------- Cozinha ---------- */

  const app = document.querySelector('#app');
  app.innerHTML = '<p class="muted">Carregando...</p>';
  const orders = (await api('/admin/orders')).filter(o=>['Recebido','Preparando','Pronto'].includes(o.status));
  const withItems = await Promise.all(orders.map(async o => ({...o, items: await api(`/admin/orders/${o.id}/items`)})));
  app.innerHTML = `
    <h1>Painel da cozinha</h1>
    <div class="kitchen-grid">
      ${withItems.map(o => `
        <div class="card kitchen-card">
          <b>#${o.id} — ${o.customer||'Cliente'}</b>
          ${o.table_number ? `<p class="muted">Mesa ${o.table_number}</p>` : ''}
          <span class="badge" data-status="${o.status}">${o.status}</span>
          <div class="items">${o.items.map(i=>`${i.quantity}× ${i.product_name}`).join('<br>')}</div>
          ${o.notes ? `<p class="muted">Obs: ${o.notes}</p>` : ''}
          <div class="actions">
            ${o.status==='Recebido' ? `<button class="btn block" onclick="updateStatus(${o.id},'Preparando')">Iniciar preparo</button>` : ''}

      `).join('') || '<p class="muted">Nenhum pedido em andamento.</p>'}

  `;
}

/* ---------- Cardápio (admin) ---------- */

      <label>Categoria</label>

      <label>Descrição</label><input id="pDesc">

          ${p.image_url ? `<img src="${p.image_url}" style="width:100%;height:130px;object-fit:cover;border-radius:10px;margin-bottom:8px">` : ''}

            <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--admin-border)">
              <label><input type="checkbox" ${p.promo_active?'checked':''} onchange="updateProduct(${p.id},{promoActive:this.checked})" style="width:auto;display:inline-block"> Em promoção</label>

              <input value="${p.promo_price||''}" placeholder="ex: 44.90" onchange="updateProduct(${p.id},{promoPrice:Number(this.value)})">

async function createCategory(){
  const name = document.querySelector('#newCategoryName').value.trim();
  if(!name) return;
  try{ await api('/admin/products/categories',{method:'POST',body:JSON.stringify({name})}); go('products'); }
  catch(e){ alert(e.message); }
}
async function updateCategory(id, name){
  try{ await api('/admin/products/categories/'+id,{method:'PATCH',body:JSON.stringify({name})}); }
  catch(e){ alert(e.message); }
}
async function deleteCategory(id){
  if(!confirm('Excluir esta categoria?')) return;
  try{ await api('/admin/products/categories/'+id,{method:'DELETE'}); go('products'); }
  catch(e){ alert(e.message); }
}
async function deleteProduct(id){
  if(!confirm('Excluir este produto? Essa ação não pode ser desfeita.')) return;
  try{ await api('/admin/products/'+id,{method:'DELETE'}); go('products'); }
  catch(e){ alert(e.message); }
}

const CLOUDINARY_CLOUD_NAME = 'wfj6nhgu';
const CLOUDINARY_UPLOAD_PRESET = 'impasto-moreira';

async function uploadToCloudinary(file){
  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
  const r = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`, { method:'POST', body: formData });
  const data = await r.json();
  if(!r.ok) throw new Error(data.error?.message || 'Falha no upload da imagem');
  return data.secure_url;
}

async function handleNewProductImage(input){
  const file = input.files[0];
  if(!file) return;
  const status = document.querySelector('#pImageStatus');
  status.textContent = 'Enviando foto...';
  try{
    newProductImageUrl = await uploadToCloudinary(file);
    status.textContent = '✅ Foto pronta — clique em Adicionar para salvar o produto';
  }catch(e){
    status.textContent = '❌ '+e.message;
    newProductImageUrl = null;
  }
}

async function handleExistingProductImage(id, input){
  const file = input.files[0];
  if(!file) return;
  const status = document.querySelector('#pImageStatus-'+id);
  status.textContent = 'Enviando foto...';
  try{
    const url = await uploadToCloudinary(file);
    await api(`/admin/products/${id}`,{method:'PATCH',body:JSON.stringify({imageUrl:url})});
    go('products');
  }catch(e){
    status.textContent = '❌ '+e.message;
  }
}

async function createProduct(){
  try{
    await api('/admin/products',{method:'POST',body:JSON.stringify({
      name: document.querySelector('#pName').value,
      categoryId: Number(document.querySelector('#pCategory').value),
      description: document.querySelector('#pDesc').value,
      price: Number(document.querySelector('#pPrice').value),
      imageUrl: newProductImageUrl
    })});
    go('products');
  }catch(e){ alert(e.message); }
}
async function updateProduct(id, patch){
  try{ await api(`/admin/products/${id}`,{method:'PATCH',body:JSON.stringify(patch)}); go('products'); }
  catch(e){ alert(e.message); }
}
async function togglePromoDay(productId){
  const checked = document.querySelectorAll('.promo-day-'+productId+':checked');
  const days = Array.from(checked).map(el=>el.value);
  try{ await api(`/admin/products/${productId}`,{method:'PATCH',body:JSON.stringify({promoDays:days})}); }
  catch(e){ alert(e.message); }
}

async function addRecipeItem(productId){
  const ingredientId = Number(document.querySelector('#recIng-'+productId).value);
  const quantity = Number(document.querySelector('#recQty-'+productId).value);
  if(!quantity) return alert('Informe a quantidade usada nesse produto');
  try{ await api('/admin/stock/recipes',{method:'POST',body:JSON.stringify({productId,ingredientId,quantity})}); go('products'); }
  catch(e){ alert(e.message); }
}
async function removeRecipeItem(recipeId, productId){
  try{ await api('/admin/stock/recipes/'+recipeId,{method:'DELETE'}); go('products'); }
  catch(e){ alert(e.message); }
}
async function updateRecipeQty(recipeId, quantity, productId){
  try{ await api('/admin/stock/recipes/'+recipeId,{method:'PATCH',body:JSON.stringify({quantity:Number(quantity)})}); }
  catch(e){ alert(e.message); }
}

/* ---------- Estoque ---------- */

  const ingredients = await api('/admin/stock');
  app.innerHTML = `
    <h1>Estoque</h1>
    <div class="card" style="max-width:480px">
      <h3>Novo ingrediente</h3>
      <label>Nome</label><input id="iName">
      <label>Unidade</label><input id="iUnit" placeholder="kg, un, l...">
      <label>Estoque inicial</label><input id="iQty" type="number" step="0.001">
      <label>Estoque mínimo</label><input id="iMin" type="number" step="0.001">
      <label>Custo unitário</label><input id="iCost" type="number" step="0.01">
      <button class="btn block" onclick="createIngredient()">Adicionar</button>
    </div>
    <table style="margin-top:16px">
      <thead><tr><th>Ingrediente</th><th>Unidade</th><th>Estoque</th><th>Mínimo</th><th>Custo</th><th>Movimentar</th><th></th></tr></thead>
      <tbody>
        ${ingredients.map(i => `
          <tr ${i.stock_qty<=i.min_qty?'style="background:#fdecea"':''}>
            <td><input value="${i.name}" style="margin:0;width:140px" onchange="updateIngredient(${i.id},{name:this.value})"></td>
            <td><input value="${i.unit}" style="margin:0;width:60px" onchange="updateIngredient(${i.id},{unit:this.value})"></td>
            <td>${i.stock_qty} ${i.unit}</td>
            <td><input value="${i.min_qty}" type="number" step="0.001" style="margin:0;width:70px" onchange="updateIngredient(${i.id},{minQty:Number(this.value)})"></td>
            <td><input value="${i.unit_cost}" type="number" step="0.01" style="margin:0;width:80px" onchange="updateIngredient(${i.id},{unitCost:Number(this.value)})"></td>
            <td>
              <select id="mtype-${i.id}" style="width:auto;display:inline-block;margin:0 6px">
                <option>Entrada</option><option>Saída</option><option>Ajuste</option>
              </select>
              <input id="mqty-${i.id}" type="number" step="0.001" style="width:80px;display:inline-block;margin:0 6px">
              <button class="btn secondary" onclick="registerMovement(${i.id})">OK</button>
            </td>
            <td><button class="btn danger" style="padding:6px 10px" onclick="deleteIngredient(${i.id})">✕</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  `;
}
async function createIngredient(){
  try{
    await api('/admin/stock',{method:'POST',body:JSON.stringify({
      name: document.querySelector('#iName').value,
      unit: document.querySelector('#iUnit').value,
      stockQty: Number(document.querySelector('#iQty').value||0),
      minQty: Number(document.querySelector('#iMin').value||0),
      unitCost: Number(document.querySelector('#iCost').value||0)
    })});
    go('stock');
  }catch(e){ alert(e.message); }
}
async function updateIngredient(id, patch){
  try{ await api('/admin/stock/'+id,{method:'PATCH',body:JSON.stringify(patch)}); }
  catch(e){ alert(e.message); }
}
async function deleteIngredient(id){
  if(!confirm('Excluir este ingrediente?')) return;
  try{ await api('/admin/stock/'+id,{method:'DELETE'}); go('stock'); }
  catch(e){ alert(e.message); }
}
async function registerMovement(id){
  const movementType = document.querySelector('#mtype-'+id).value;
  const quantity = Number(document.querySelector('#mqty-'+id).value||0);
  if(!quantity) return;
  try{ await api('/admin/stock/movements',{method:'POST',body:JSON.stringify({ingredientId:id,movementType,quantity})}); go('stock'); }
  catch(e){ alert(e.message); }
}

/* ---------- Entrega (bairros e taxas) ---------- */

  app.innerHTML = `

    <p class="muted">Cadastre os bairros que você atende e a taxa de entrega de cada um. O bairro chamado <b>PADRÃO</b> é usado quando o cliente digita um bairro que não está na lista — ajuste essa taxa "coringa" também.</p>

      <h3>Novo bairro</h3>
      <label>Bairro</label><input id="dNeighborhood" placeholder="ex: Centro">
      <label>Cidade</label><input id="dCity" placeholder="ex: Sua Cidade">

      <tbody>
        ${zones.map(z => `
          <tr>
            <td><b>${z.neighborhood}</b></td>
            <td><input value="${z.city||''}" style="margin:0;width:140px" onchange="updateDeliveryZone(${z.id},{city:this.value})"></td>

async function createDeliveryZone(){

  catch(e){ alert(e.message); }
}
async function updateDeliveryZone(id, patch){
  try{ await api('/admin/delivery-zones/'+id,{method:'PATCH',body:JSON.stringify(patch)}); }
  catch(e){ alert(e.message); }
}
async function deleteDeliveryZone(id){
  if(!confirm('Excluir este bairro?')) return;
  try{ await api('/admin/delivery-zones/'+id,{method:'DELETE'}); go('delivery'); }
  catch(e){ alert(e.message); }
}

/* ---------- Cupons de desconto ---------- */
async function renderCoupons(){
  const app = document.querySelector('#app');
  app.innerHTML = '<p class="muted">Carregando...</p>';
  const coupons = await api('/admin/coupons');
  app.innerHTML = `
    <h1>Cupons de desconto</h1>
    <div class="card" style="max-width:480px">
      <h3>Novo cupom</h3>
      <label>Código (o cliente vai digitar isso)</label>
      <input id="cCode" placeholder="ex: PIZZA10" style="text-transform:uppercase">
      <label>Tipo de desconto</label>
      <select id="cType"><option value="percent">Percentual (%)</option><option value="fixed">Valor fixo (R$)</option></select>
      <label>Valor do desconto</label>
      <input id="cValue" type="number" step="0.01" placeholder="ex: 10">
      <label>Pedido mínimo</label>
      <input id="cMin" type="number" step="0.01" placeholder="ex: 40">
      <label>Limite de usos (vazio = ilimitado)</label>
      <input id="cMax" type="number" step="1">
      <label>Válido até (vazio = sem prazo)</label>
      <input id="cUntil" type="date">
      <button class="btn block" onclick="createCoupon()">Criar cupom</button>
    </div>
    <table style="margin-top:16px">
      <thead><tr><th>Código</th><th>Desconto</th><th>Mín.</th><th>Usos</th><th>Válido até</th><th>Ativo</th><th></th></tr></thead>
      <tbody>
        ${coupons.map(c => `
          <tr>
            <td><b>${c.code}</b></td>
            <td>${c.discount_type==='percent' ? c.discount_value+'%' : money(c.discount_value)}</td>
            <td>${money(c.min_order_value)}</td>
            <td>${c.used_count}${c.max_uses?'/'+c.max_uses:''}</td>
            <td>${c.valid_until ? new Date(c.valid_until).toLocaleDateString('pt-BR') : '—'}</td>
            <td><input type="checkbox" ${c.active?'checked':''} style="width:auto" onchange="updateCoupon(${c.id},{active:this.checked})"></td>
            <td><button class="btn danger" style="padding:6px 10px" onclick="deleteCoupon(${c.id})">✕</button></td>
          </tr>
        `).join('') || '<tr><td colspan="7" class="muted">Nenhum cupom criado ainda</td></tr>'}
      </tbody>
    </table>
  `;
}
async function createCoupon(){
  try{
    await api('/admin/coupons',{method:'POST',body:JSON.stringify({
      code: document.querySelector('#cCode').value,
      discountType: document.querySelector('#cType').value,
      discountValue: Number(document.querySelector('#cValue').value),
      minOrderValue: Number(document.querySelector('#cMin').value||0),
      maxUses: document.querySelector('#cMax').value ? Number(document.querySelector('#cMax').value) : null,
      validUntil: document.querySelector('#cUntil').value || null
    })});
    go('coupons');
  }catch(e){ alert(e.message); }
}
async function updateCoupon(id, patch){
  try{ await api('/admin/coupons/'+id,{method:'PATCH',body:JSON.stringify(patch)}); }
  catch(e){ alert(e.message); }
}
async function deleteCoupon(id){
  if(!confirm('Excluir este cupom?')) return;
  try{ await api('/admin/coupons/'+id,{method:'DELETE'}); go('coupons'); }
  catch(e){ alert(e.message); }
}

/* ---------- Relatórios ---------- */
async function renderReports(){
  const app = document.querySelector('#app');
  app.innerHTML = '<p class="muted">Carregando...</p>';
  const [byDay, topProducts, byCategory, cmv] = await Promise.all([
    api('/admin/reports/sales-by-day'), api('/admin/reports/top-products'), api('/admin/reports/by-category'), api('/admin/reports/cmv')
  ]);
  app.innerHTML = `
    <h1>Relatórios</h1>
    <h2 class="category-title" style="color:var(--gold)">CMV — Custo da Mercadoria Vendida</h2>
    <div class="grid">
      <div class="card"><span class="muted">Custo total (ingredientes vendidos)</span><div class="kpi">${money(cmv.overall.totalCost)}</div></div>
      <div class="card"><span class="muted">Receita das vendas</span><div class="kpi">${money(cmv.overall.totalRevenue)}</div></div>
      <div class="card"><span class="muted">CMV realizado</span><div class="kpi">${cmv.overall.cmvPercent}%</div></div>
    </div>
    <p class="muted" style="margin-top:10px">CMV realizado é calculado com base nos pedidos já feitos. Preço sugerido = custo × (1 + margem alvo de ${cmv.targetMarkupPercent}% — ajuste em Configurações). A caixa de pizza não entra nesse custo, é controlada separadamente.</p>
    <table style="margin-top:10px">
      <thead><tr><th>Produto</th><th>Preço cobrado</th><th>Custo</th><th>Origem</th><th>CMV</th><th>Lucro/un.</th><th>Preço sugerido</th></tr></thead>
      <tbody>${cmv.products.map(p=>`<tr><td>${p.name}</td><td>${money(p.price)}</td><td>${money(p.cost)}</td><td class="muted" style="font-size:.8rem">${p.costSource}</td><td>${p.cmvPercent}%</td><td>${money(p.profitPerUnit)}</td><td class="muted">${money(p.suggestedPrice)}</td></tr>`).join('') || '<tr><td colspan="7" class="muted">Sem produtos ativos</td></tr>'}</tbody>
    </table>
    <h2 class="category-title" style="color:var(--gold)">Vendas por dia</h2>
    <table><thead><tr><th>Dia</th><th>Pedidos</th><th>Total</th></tr></thead>
    <tbody>${byDay.map(d=>`<tr><td>${new Date(d.day).toLocaleDateString('pt-BR')}</td><td>${d.orders}</td><td>${money(d.total)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Sem dados</td></tr>'}</tbody></table>
    <h2 class="category-title" style="color:var(--gold)">Produtos mais vendidos</h2>
    <table><thead><tr><th>Produto</th><th>Qtd.</th><th>Receita</th></tr></thead>
    <tbody>${topProducts.map(p=>`<tr><td>${p.product_name}</td><td>${p.qty}</td><td>${money(p.revenue)}</td></tr>`).join('') || '<tr><td colspan="3" class="muted">Sem dados</td></tr>'}</tbody></table>
    <h2 class="category-title" style="color:var(--gold)">Receita por categoria</h2>
    <table><thead><tr><th>Categoria</th><th>Receita</th></tr></thead>
    <tbody>${byCategory.map(c=>`<tr><td>${c.category}</td><td>${money(c.revenue)}</td></tr>`).join('') || '<tr><td colspan="2" class="muted">Sem dados</td></tr>'}</tbody></table>
  `;
}

    <h1>Usuários</h1>
    <div class="card" style="max-width:480px">
      <h3>Novo usuário</h3>
      <label>Nome</label><input id="uName">

async function createUser(){

      password: document.querySelector('#uPass').value,

    })});

async function toggleUserActive(id, active){

/* ---------- Configurações ---------- */
async function renderSettings(){
  const app = document.querySelector('#app');
  app.innerHTML = '<p class="muted">Carregando...</p>';
  const [s, paymentMethods] = await Promise.all([api('/admin/settings'), api('/admin/payment-methods')]);
  const menuUrl = window.location.origin + '/';
  const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=240x240&data=' + encodeURIComponent(menuUrl);
  app.innerHTML = `
    <h1>Configurações</h1>
    <div class="grid">
      <div class="card">
        <h3>Dados do restaurante</h3>
        <label>Nome do restaurante</label>
        <input id="sName" value="${s.restaurantName||''}">
        <label>WhatsApp para pedidos (com DDI e DDD, só números — ex: 5511999998888)</label>
        <input id="sWhats" value="${s.whatsappNumber||''}">
        <p class="muted">Preenchido, o cardápio público mostra o botão "Confirmar e enviar pelo WhatsApp" no checkout.</p>
        <label>Instagram (link completo)</label>
        <input id="sInstagram" value="${s.instagramUrl||''}" placeholder="https://instagram.com/impastomoreira">
        <label>Margem de lucro alvo (%) — usada para calcular o "Preço sugerido" em Relatórios</label>
        <input id="sMarkup" type="number" step="1" value="${s.targetMarkupPercent||230}">
        <button class="btn block" onclick="saveSettings()">Salvar</button>
      </div>
      <div class="card">
        <h3>Formas de pagamento</h3>
        <p class="muted">Aparecem, nessa ordem, no checkout do cardápio.</p>
        ${paymentMethods.map(pm => `
          <div style="display:flex;gap:6px;align-items:center;margin-bottom:6px">
            <input value="${pm.name}" style="flex:1;margin:0" onchange="updatePaymentMethod(${pm.id},{name:this.value})">
            <input type="checkbox" ${pm.active?'checked':''} style="width:auto" title="Ativo" onchange="updatePaymentMethod(${pm.id},{active:this.checked})">
            <button class="btn danger" style="padding:8px 12px" onclick="deletePaymentMethod(${pm.id})">✕</button>
          </div>
        `).join('')}
        <div style="display:flex;gap:6px;margin-top:8px">
          <input id="newPaymentName" placeholder="Nova forma de pagamento" style="flex:1;margin:0">
          <button class="btn secondary" style="padding:8px 12px" onclick="createPaymentMethod()">+</button>
        </div>
      </div>
      <div class="card" style="text-align:center">
        <h3>Divulgue seu cardápio</h3>
        <img src="${qrSrc}" alt="QR Code do cardápio" style="border-radius:12px;margin:8px 0">
        <p class="muted" style="word-break:break-all">${menuUrl}</p>
        <button class="btn secondary block" onclick="navigator.clipboard.writeText('${menuUrl}');this.textContent='Link copiado!'">Copiar link</button>
      </div>
      <div class="card" style="text-align:center">
        <h3>QR Code de mesa (atendimento no salão)</h3>
        <p class="muted">Gere um QR por mesa — ao escanear, o cliente já cai no cardápio com "Mesa" pré-selecionada.</p>
        <input id="tableNumber" type="number" placeholder="Número da mesa" style="max-width:200px;margin:8px auto">
        <button class="btn block" style="max-width:200px;margin:0 auto" onclick="generateTableQR()">Gerar QR</button>
        <div id="tableQRResult" style="margin-top:14px"></div>
      </div>
    </div>
  `;
}
async function createPaymentMethod(){
  const name = document.querySelector('#newPaymentName').value.trim();
  if(!name) return;
  try{ await api('/admin/payment-methods',{method:'POST',body:JSON.stringify({name})}); go('settings'); }
  catch(e){ alert(e.message); }
}
async function updatePaymentMethod(id, patch){
  try{ await api('/admin/payment-methods/'+id,{method:'PATCH',body:JSON.stringify(patch)}); }
  catch(e){ alert(e.message); }
}
async function deletePaymentMethod(id){
  if(!confirm('Excluir esta forma de pagamento?')) return;
  try{ await api('/admin/payment-methods/'+id,{method:'DELETE'}); go('settings'); }
  catch(e){ alert(e.message); }
}
function generateTableQR(){
  const n = document.querySelector('#tableNumber').value;
  if(!n) return alert('Informe o número da mesa');
  const url = window.location.origin + '/?mesa=' + encodeURIComponent(n);
  const qrSrc = 'https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=' + encodeURIComponent(url);
  document.querySelector('#tableQRResult').innerHTML = `
    <p><b>Mesa ${n}</b></p>
    <img src="${qrSrc}" alt="QR mesa ${n}" style="border-radius:10px">
    <p class="muted" style="word-break:break-all;font-size:.8rem">${url}</p>
  `;
}
async function saveSettings(){
  try{
    await api('/admin/settings',{method:'PATCH',body:JSON.stringify({
      restaurantName: document.querySelector('#sName').value,
      whatsappNumber: document.querySelector('#sWhats').value.replace(/\D/g,''),
      instagramUrl: document.querySelector('#sInstagram').value,
      targetMarkupPercent: Number(document.querySelector('#sMarkup').value)
    })});
    go('settings');
  }catch(e){ alert(e.message); }
}

boot();
</script>
</body>
</html>
